<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 2rem; background: #fafafa; }
      .box { max-width: 560px; margin: 10vh auto; text-align: center; }
      .muted { color: #666; }
      button { margin-top: 1rem; padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid #ddd; background: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Vous êtes hors ligne</h1>
      <p class="muted">Vérifiez votre connexion Internet puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
